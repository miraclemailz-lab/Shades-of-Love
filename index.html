<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>69 Shades of Play - Extended Edition</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #2d1b2e 0%, #1a0f2e 50%, #0f0a1a 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        .serif-font {
            font-family: 'Georgia', 'Garamond', serif;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardSwipeLeft {
            to {
                opacity: 0;
                transform: translateX(-500px) rotate(-20deg);
            }
        }

        @keyframes cardSwipeRight {
            to {
                opacity: 0;
                transform: translateX(500px) rotate(20deg);
            }
        }

        @keyframes pop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes pulseHint {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 12px rgba(236, 72, 153, 0.8)); }
        }

        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .slide-up {
            animation: slideInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .swipe-left {
            animation: cardSwipeLeft 0.5s ease-out forwards;
        }

        .swipe-right {
            animation: cardSwipeRight 0.5s ease-out forwards;
        }

        .pop-animation {
            animation: pop 0.4s ease-out;
        }

        .pulse-hint {
            animation: pulseHint 2s infinite ease-in-out;
        }

        .gradient-pink {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
        }

        .gradient-dark {
            background: linear-gradient(135deg, #1a0f2e 0%, #2d1b2e 100%);
        }

        /* 3D Card Flip Architecture */
        .card-flip-container {
            perspective: 1200px;
            width: 100%;
        }

        .card-flip-inner {
            position: relative;
            width: 100%;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.34, 1.4, 0.64, 1);
            min-height: 480px;
        }

        .card-flip-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            width: 100%;
            height: 100%;
            min-height: 480px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 30px;
        }

        .card-face-back {
            transform: rotateY(0deg);
            cursor: pointer;
            background: linear-gradient(145deg, rgba(38, 18, 48, 0.97) 0%, rgba(22, 11, 38, 0.98) 100%);
            border: 2px solid rgba(236, 72, 153, 0.35);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 0 35px rgba(236, 72, 153, 0.12);
            transition: all 0.35s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .card-face-back::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(236, 72, 153, 0.12) 0%, transparent 60%);
            pointer-events: none;
            animation: rotateSlow 25s linear infinite;
        }

        .card-face-back:hover {
            border-color: rgba(236, 72, 153, 0.7);
            box-shadow: 0 25px 70px rgba(236, 72, 153, 0.3), inset 0 0 40px rgba(236, 72, 153, 0.2);
            transform: translateY(-4px) scale(1.01);
        }

        .card-face-front {
            transform: rotateY(180deg);
            position: absolute;
            top: 0;
            left: 0;
            background: linear-gradient(135deg, rgba(45, 27, 46, 0.97) 0%, rgba(26, 15, 46, 0.98) 100%);
            border: 1px solid rgba(236, 72, 153, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .card-face-front::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.1) 0%, transparent 50%, rgba(219, 39, 119, 0.05) 100%);
            pointer-events: none;
        }

        .partner-card {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .partner-card:hover {
            transform: translateY(-4px) scale(1.02);
        }

        .panic-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            border: 2px solid #fca5a5;
            color: white;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.4);
        }

        .panic-button:hover {
            transform: scale(1.15);
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.6);
        }

        .action-button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-button.skip {
            background: rgba(100, 100, 100, 0.8);
            border: 2px solid rgba(150, 150, 150, 0.5);
        }

        .action-button.skip:hover {
            background: rgba(120, 120, 120, 0.9);
            transform: scale(1.1);
        }

        .action-button.love {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            border: 2px solid #f472b6;
        }

        .action-button.love:hover {
            transform: scale(1.15);
            box-shadow: 0 15px 40px rgba(236, 72, 153, 0.5);
        }

        .action-button.next {
            background: rgba(80, 80, 120, 0.8);
            border: 2px solid rgba(150, 150, 200, 0.5);
        }

        .action-button.next:hover {
            background: rgba(100, 100, 150, 0.9);
            transform: scale(1.1);
        }

        .timer-display {
            font-size: 14px;
            color: #ec4899;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(236, 72, 153, 0.2);
            color: #f472b6;
            border: 1px solid rgba(236, 72, 153, 0.4);
        }

        .intensity-indicator {
            display: flex;
            gap: 6px;
        }

        .intensity-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(236, 72, 153, 0.3);
            transition: all 0.3s ease;
        }

        .intensity-dot.active {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.6);
        }

        .progress-ring {
            transform: rotate(-90deg);
        }

        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s;
            stroke: #ec4899;
            fill: transparent;
        }

        .onboarding-content {
            background: linear-gradient(135deg, rgba(45, 27, 46, 0.9) 0%, rgba(26, 15, 46, 0.9) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(236, 72, 153, 0.2);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .section-complete-illustration {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pop 0.6s ease-out;
        }

        @media (max-width: 768px) {
            .action-button {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }

            .panic-button {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }

            .card-flip-inner, .card-face {
                min-height: 440px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
          const [gameState, setGameState] = useState('onboarding'); // 'onboarding' | 'whoStarts' | 'playing' | 'sectionComplete' | 'gameComplete'
          const [currentTurn, setCurrentTurn] = useState('male'); // 'male' | 'female'
          const [isCardFlipped, setIsCardFlipped] = useState(false);
          const [currentSection, setCurrentSection] = useState(1);
          const [completedTasksInSection, setCompletedTasksInSection] = useState(0);
          const [availableCards, setAvailableCards] = useState([]);
          const [currentCard, setCurrentCard] = useState(null);
          const [timerActive, setTimerActive] = useState(false);
          const [timeRemaining, setTimeRemaining] = useState(0);
          const [totalCompleted, setTotalCompleted] = useState(0);
          const [allCards, setAllCards] = useState([]);
          const [cardAnimation, setCardAnimation] = useState(null);
          const timerRef = useRef(null);

          useEffect(() => {
            const loadCards = async () => {
              try {
                const response = await fetch('cards.json');
                const data = await response.json();
                const allCardsArray = [
                  ...data.section_1_love_romantic,
                  ...data.section_2_hug_kisses,
                  ...data.section_3_strip_playful,
                  ...data.section_4_fantasy_extended_play,
                  ...data.section_5_intense_aftercare
                ];
                setAllCards(allCardsArray);
              } catch (error) {
                console.error('Failed to load cards:', error);
                alert('Could not load cards. Please refresh the page.');
              }
            };
            loadCards();
          }, []);

          useEffect(() => {
            if (timerActive && timeRemaining > 0) {
              timerRef.current = setTimeout(() => {
                setTimeRemaining(prev => prev - 1);
              }, 1000);
            } else if (timeRemaining === 0 && timerActive) {
              setTimerActive(false);
            }
            return () => clearTimeout(timerRef.current);
          }, [timerActive, timeRemaining]);

          const initializeSection = (sectionNum) => {
            const sectionCards = allCards.filter(c => c.section === sectionNum);
            const shuffled = [...sectionCards].sort(() => Math.random() - 0.5);
            setAvailableCards(shuffled);
            setCurrentCard(shuffled[0]);
            setCompletedTasksInSection(0);
            setCurrentSection(sectionNum);
            setIsCardFlipped(false);
          };

          const goToWhoStarts = () => {
            if (allCards.length === 0) {
              alert('Cards not loaded yet. Please refresh.');
              return;
            }
            setGameState('whoStarts');
          };

          const startGame = (startingPartner) => {
            initializeSection(1);
            setCurrentTurn(startingPartner || 'male');
            setIsCardFlipped(false);
            setGameState('playing');
            setTotalCompleted(0);
          };

          const handleCardFlip = () => {
            if (!isCardFlipped) {
              setIsCardFlipped(true);
            }
          };

          const handleSwitchTurn = () => {
            setCurrentTurn(prev => prev === 'male' ? 'female' : 'male');
          };

          const handleSkip = () => {
            setCardAnimation('skip');
            setTimeout(() => {
              const remaining = availableCards.slice(1);
              const reshuffled = [...remaining, currentCard].sort(() => Math.random() - 0.5);
              setAvailableCards(reshuffled);
              setCurrentCard(reshuffled[0]);
              setCardAnimation(null);
              setTimerActive(false);
              setIsCardFlipped(false);
              // Alternate turn to partner
              setCurrentTurn(prev => prev === 'male' ? 'female' : 'male');
            }, 500);
          };

          const handleComplete = () => {
            setCardAnimation('complete');
            setTimeout(() => {
              setTimerActive(false);
              setCompletedTasksInSection(prev => prev + 1);
              setTotalCompleted(prev => prev + 1);
              setIsCardFlipped(false);
              // Alternate turn to partner
              setCurrentTurn(prev => prev === 'male' ? 'female' : 'male');

              const remaining = availableCards.slice(1);
              if (remaining.length === 0 || completedTasksInSection + 1 >= 10) {
                setGameState('sectionComplete');
              } else {
                setCurrentCard(remaining[0]);
                setAvailableCards(remaining);
                setCardAnimation(null);
              }
            }, 500);
          };

          const nextSection = () => {
            if (currentSection < 5) {
              initializeSection(currentSection + 1);
              setGameState('playing');
            } else {
              setGameState('gameComplete');
            }
          };

          const panicClick = () => {
            if (confirm('Close game?')) {
              window.location.href = 'https://www.google.com';
            }
          };

          const resetGame = () => {
            setGameState('onboarding');
            setCurrentSection(1);
            setCompletedTasksInSection(0);
            setTotalCompleted(0);
            setIsCardFlipped(false);
          };

          const formatTime = (seconds) => {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
          };

          const sectionNames = {
            1: 'Love & Romantic',
            2: 'Hug & Kisses',
            3: 'Strip & Playful',
            4: 'Fantasy & Extended',
            5: 'Intense & Aftercare'
          };

          return (
            <div className="min-h-screen w-full flex items-center justify-center p-4 gradient-dark">
              <button onClick={panicClick} className="panic-button">✕</button>

              {gameState === 'onboarding' && (
                <OnboardingScreen onNext={goToWhoStarts} />
              )}

              {gameState === 'whoStarts' && (
                <WhoStartsFirstScreen onSelectStarter={startGame} />
              )}

              {gameState === 'playing' && currentCard && (
                <PlayingScreen
                  currentCard={currentCard}
                  currentSection={currentSection}
                  completedInSection={completedTasksInSection}
                  totalCompleted={totalCompleted}
                  cardAnimation={cardAnimation}
                  timerActive={timerActive}
                  timeRemaining={timeRemaining}
                  currentTurn={currentTurn}
                  isCardFlipped={isCardFlipped}
                  onFlipCard={handleCardFlip}
                  onSwitchTurn={handleSwitchTurn}
                  onSkip={handleSkip}
                  onComplete={handleComplete}
                  onStartTimer={() => {
                    setTimeRemaining(currentCard.timer);
                    setTimerActive(true);
                  }}
                  formatTime={formatTime}
                  sectionNames={sectionNames}
                />
              )}

              {gameState === 'sectionComplete' && (
                <SectionCompleteScreen
                  sectionNum={currentSection}
                  totalCompleted={totalCompleted}
                  nextSection={nextSection}
                  sectionNames={sectionNames}
                />
              )}

              {gameState === 'gameComplete' && (
                <GameCompleteScreen totalCompleted={totalCompleted} resetGame={resetGame} />
              )}
            </div>
          );
        }

        function OnboardingScreen({ onNext }) {
          const [confirmed, setConfirmed] = useState(false);

          return (
            <div className="w-full max-w-md mx-auto slide-up">
              <div className="onboarding-content p-8 text-center">
                <div className="mb-6">
                  <h1 className="serif-font text-5xl font-bold mb-2 bg-gradient-to-r from-pink-300 via-pink-400 to-rose-400 bg-clip-text text-transparent">
                    69 Shades
                  </h1>
                  <p className="text-pink-300 text-sm tracking-widest uppercase font-semibold">of Play</p>
                </div>

                <div className="space-y-4 text-left mb-8">
                  <p className="text-gray-300 text-sm leading-relaxed">
                    A journey of intimacy, trust, and connection. Explore <strong>5 progressive sections</strong> with <strong>80 cards each</strong>.
                  </p>
                  <ul className="text-gray-400 text-xs space-y-2 ml-4">
                    <li>💜 <strong>Love & Romantic</strong> - Emotional moments</li>
                    <li>💋 <strong>Hug & Kisses</strong> - Touch & affection</li>
                    <li>✨ <strong>Strip & Playful</strong> - Vulnerability</li>
                    <li>🔥 <strong>Fantasy & Extended</strong> - Passion</li>
                    <li>💥 <strong>Intense & Aftercare</strong> - Peak intimacy</li>
                  </ul>
                </div>

                <div className="flex items-start gap-3 mb-8 bg-black/30 p-4 rounded-lg border border-pink-500/20">
                  <input
                    type="checkbox"
                    id="ageConfirm"
                    checked={confirmed}
                    onChange={(e) => setConfirmed(e.target.checked)}
                    className="w-5 h-5 rounded accent-pink-500 mt-1"
                  />
                  <label htmlFor="ageConfirm" className="text-xs text-gray-400 cursor-pointer">
                    I confirm I am 18+ and ready to explore intimacy responsibly with my partner.
                  </label>
                </div>

                <button
                  onClick={onNext}
                  disabled={!confirmed}
                  className={`w-full py-4 rounded-full font-bold text-lg transition-all ${
                    confirmed
                      ? 'gradient-pink text-white hover:shadow-lg hover:shadow-pink-500/50 cursor-pointer'
                      : 'bg-gray-700 text-gray-400 cursor-not-allowed'
                  }`}
                >
                  Get Started ➜
                </button>
              </div>
            </div>
          );
        }

        function WhoStartsFirstScreen({ onSelectStarter }) {
          const [selectedPartner, setSelectedPartner] = useState(null); // 'male' | 'female'
          const [isSpinning, setIsSpinning] = useState(false);
          const [spinHighlight, setSpinHighlight] = useState(null);
          const [revealed, setRevealed] = useState(false);

          const handleDirectSelect = (gender) => {
            if (isSpinning) return;
            setSelectedPartner(gender);
            setRevealed(true);
          };

          const handleSpinFate = () => {
            if (isSpinning) return;
            setIsSpinning(true);
            setRevealed(false);
            setSelectedPartner(null);

            let count = 0;
            const totalSteps = 16;
            const intervalTime = 90;

            const interval = setInterval(() => {
              count++;
              const current = count % 2 === 0 ? 'male' : 'female';
              setSpinHighlight(current);

              if (count >= totalSteps) {
                clearInterval(interval);
                const finalWinner = Math.random() < 0.5 ? 'male' : 'female';
                setSpinHighlight(finalWinner);
                setSelectedPartner(finalWinner);
                setIsSpinning(false);
                setRevealed(true);
              }
            }, intervalTime);
          };

          const handleStartGame = () => {
            if (!selectedPartner) return;
            onSelectStarter(selectedPartner);
          };

          return (
            <div className="w-full max-w-md mx-auto slide-up">
              <div className="onboarding-content p-8 text-center relative overflow-hidden">
                <div className="mb-6">
                  <span className="text-xs uppercase tracking-widest text-pink-400 font-semibold mb-2 block">
                    Game Setup
                  </span>
                  <h2 className="serif-font text-3xl sm:text-4xl font-bold mb-2 bg-gradient-to-r from-pink-300 via-rose-300 to-purple-300 bg-clip-text text-transparent">
                    Who Starts First?
                  </h2>
                  <p className="text-gray-300 text-xs sm:text-sm">
                    Choose who will take the lead to reveal and start the very first task.
                  </p>
                </div>

                {/* Partner Choices */}
                <div className="grid grid-cols-2 gap-4 mb-6">
                  {/* Male / He Option */}
                  <div
                    onClick={() => handleDirectSelect('male')}
                    className={`partner-card cursor-pointer p-5 rounded-2xl border text-center transition-all ${
                      (selectedPartner === 'male' || spinHighlight === 'male')
                        ? 'bg-gradient-to-b from-indigo-950/90 to-purple-950/90 border-cyan-400 shadow-lg shadow-cyan-500/30 scale-105'
                        : 'bg-black/30 border-indigo-500/30 hover:border-indigo-400/60'
                    }`}
                  >
                    <div className="text-4xl mb-2">♂️</div>
                    <h3 className="font-bold text-white text-base mb-1">He / Him</h3>
                    <p className="text-xs text-indigo-300">Male Partner</p>
                    {selectedPartner === 'male' && (
                      <span className="inline-block mt-2 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-400/40">
                        Selected ✓
                      </span>
                    )}
                  </div>

                  {/* Female / She Option */}
                  <div
                    onClick={() => handleDirectSelect('female')}
                    className={`partner-card cursor-pointer p-5 rounded-2xl border text-center transition-all ${
                      (selectedPartner === 'female' || spinHighlight === 'female')
                        ? 'bg-gradient-to-b from-pink-950/90 to-rose-950/90 border-pink-400 shadow-lg shadow-pink-500/30 scale-105'
                        : 'bg-black/30 border-pink-500/30 hover:border-pink-400/60'
                    }`}
                  >
                    <div className="text-4xl mb-2">♀️</div>
                    <h3 className="font-bold text-white text-base mb-1">She / Her</h3>
                    <p className="text-xs text-pink-300">Female Partner</p>
                    {selectedPartner === 'female' && (
                      <span className="inline-block mt-2 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full bg-pink-500/20 text-pink-300 border border-pink-400/40">
                        Selected ✓
                      </span>
                    )}
                  </div>
                </div>

                {/* Fate / Random Decision Button */}
                <div className="mb-6">
                  <button
                    onClick={handleSpinFate}
                    disabled={isSpinning}
                    className={`w-full py-3 px-4 rounded-xl border border-pink-500/40 bg-black/40 text-pink-200 text-sm font-semibold flex items-center justify-center gap-2 transition-all ${
                      isSpinning ? 'opacity-75 cursor-wait' : 'hover:bg-pink-950/40 hover:border-pink-400 cursor-pointer'
                    }`}
                  >
                    <span className="text-lg">🎲</span>
                    {isSpinning ? 'Consulting the Oracle...' : 'Let Fate Decide (Random)'}
                  </button>
                </div>

                {/* Announcement Card once revealed */}
                {revealed && selectedPartner && (
                  <div className="mb-6 p-4 rounded-2xl bg-gradient-to-r from-pink-950/60 to-purple-950/60 border border-pink-500/40 slide-up">
                    <p className="text-xs uppercase tracking-wider text-pink-400 font-bold mb-1">
                      Ready to Begin
                    </p>
                    <p className="text-lg font-bold text-white">
                      🎉 {selectedPartner === 'male' ? 'He / Him (♂️)' : 'She / Her (♀️)'} will flip first!
                    </p>
                    <p className="text-xs text-gray-300 mt-1">
                      Partners will automatically alternate turns after every task.
                    </p>
                  </div>
                )}

                {/* Start Game Action */}
                <button
                  onClick={handleStartGame}
                  disabled={!selectedPartner || isSpinning}
                  className={`w-full py-4 rounded-full font-bold text-lg transition-all ${
                    selectedPartner && !isSpinning
                      ? 'gradient-pink text-white hover:shadow-lg hover:shadow-pink-500/50 cursor-pointer'
                      : 'bg-gray-700 text-gray-400 cursor-not-allowed'
                  }`}
                >
                  {selectedPartner ? "Start Game ➜" : "Select Who Starts"}
                </button>
              </div>
            </div>
          );
        }

        function PlayingScreen({
          currentCard,
          currentSection,
          completedInSection,
          totalCompleted,
          cardAnimation,
          timerActive,
          timeRemaining,
          currentTurn,
          isCardFlipped,
          onFlipCard,
          onSwitchTurn,
          onSkip,
          onComplete,
          onStartTimer,
          formatTime,
          sectionNames
        }) {
          const circumference = 2 * Math.PI * 45;
          const strokeDashoffset = circumference - (timeRemaining / (currentCard.timer || 180)) * circumference;
          const intensityDots = Array(5).fill(0).map((_, i) => i < (currentCard.intensity || 2));

          const partnerLabel = currentTurn === 'male' ? "His Turn (♂️)" : "Her Turn (♀️)";
          const partnerAction = currentTurn === 'male' ? "He flips & leads" : "She flips & leads";

          return (
            <div className="w-full max-w-md mx-auto flex flex-col items-center justify-center gap-6">
              {/* Top Header: Section + Active Turn Pill + Task Progress */}
              <div className="w-full">
                <div className="flex justify-between items-center mb-3">
                  <span className="badge">{sectionNames[currentSection]}</span>
                  
                  {/* Interactive Turn Switch Badge */}
                  <button
                    onClick={onSwitchTurn}
                    title="Click to switch partner turn manually"
                    className={`text-xs px-3 py-1.5 rounded-full font-semibold border flex items-center gap-1.5 transition-all hover:scale-105 cursor-pointer ${
                      currentTurn === 'male'
                        ? 'bg-indigo-950/80 border-cyan-400/50 text-cyan-300 shadow-sm shadow-cyan-500/20'
                        : 'bg-pink-950/80 border-pink-400/50 text-pink-300 shadow-sm shadow-pink-500/20'
                    }`}
                  >
                    <span>{currentTurn === 'male' ? '♂️' : '♀️'}</span>
                    <span>{currentTurn === 'male' ? 'His Turn' : 'Her Turn'}</span>
                    <span className="text-[10px] opacity-70">⇄</span>
                  </button>

                  <span className="text-xs text-gray-400">Task {completedInSection}/10</span>
                </div>

                {/* Progress Bar */}
                <div className="w-full h-1 bg-gray-800 rounded-full overflow-hidden border border-pink-500/20">
                  <div 
                    className="h-full gradient-pink transition-all duration-300"
                    style={{ width: `${(completedInSection / 10) * 100}%` }}
                  ></div>
                </div>
              </div>

              {/* 3D Flip Card Container */}
              <div className={`card-flip-container ${cardAnimation ? (cardAnimation === 'skip' ? 'swipe-left' : 'swipe-right') : ''}`}>
                <div className={`card-flip-inner ${isCardFlipped ? 'is-flipped' : ''}`}>
                  
                  {/* CARD BACK (Facedown - Tap to Reveal) */}
                  <div
                    onClick={onFlipCard}
                    className="card-face card-face-back p-8 flex flex-col justify-between"
                  >
                    {/* Card Back Top Badge */}
                    <div className="flex items-center justify-between z-10">
                      <span className="timer-display">{sectionNames[currentSection]}</span>
                      <span className={`text-xs px-2.5 py-1 rounded-full font-bold border ${
                        currentTurn === 'male'
                          ? 'bg-indigo-900/60 border-cyan-400/40 text-cyan-300'
                          : 'bg-pink-900/60 border-pink-400/40 text-pink-300'
                      }`}>
                        {currentTurn === 'male' ? '♂️ He Leads' : '♀️ She Leads'}
                      </span>
                    </div>

                    {/* Card Back Center Emblem */}
                    <div className="my-auto text-center z-10 flex flex-col items-center">
                      <div className="w-24 h-24 rounded-full bg-gradient-to-tr from-pink-600/30 to-purple-600/30 border border-pink-400/40 flex items-center justify-center mb-4 pulse-hint shadow-lg shadow-pink-500/20">
                        <span className="text-4xl">{currentTurn === 'male' ? '💋' : '🔥'}</span>
                      </div>
                      
                      <h2 className="serif-font text-3xl font-bold text-white mb-2 tracking-wide">
                        69 Shades
                      </h2>
                      <p className="text-xs uppercase tracking-widest text-pink-300 font-semibold mb-6">
                        Secret Intimate Task
                      </p>

                      <div className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-pink-500/20 border border-pink-400/50 text-pink-200 text-sm font-semibold pulse-hint">
                        <span>✨</span>
                        <span>Tap to Reveal Task</span>
                        <span>✨</span>
                      </div>
                    </div>

                    {/* Card Back Bottom Info */}
                    <div className="text-center text-xs text-gray-400 z-10">
                      <p>Active Partner: <strong className="text-pink-300">{partnerLabel}</strong></p>
                      <p className="text-[11px] text-gray-500 mt-0.5">Tap anywhere on the card to flip</p>
                    </div>
                  </div>

                  {/* CARD FRONT (Revealed Task Details) */}
                  <div className="card-face card-face-front p-8 flex flex-col justify-between">
                    {/* Top Section */}
                    <div>
                      <div className="flex items-center justify-between mb-4">
                        <span className="timer-display">{currentCard.category}</span>
                        <div className="intensity-indicator">
                          {intensityDots.map((active, i) => (
                            <div key={i} className={`intensity-dot ${active ? 'active' : ''}`}></div>
                          ))}
                        </div>
                      </div>

                      <div className="mb-2 flex items-center gap-2">
                        <span className={`text-[11px] px-2 py-0.5 rounded-md font-bold uppercase ${
                          currentTurn === 'male'
                            ? 'bg-cyan-950 text-cyan-300 border border-cyan-500/30'
                            : 'bg-pink-950 text-pink-300 border border-pink-500/30'
                        }`}>
                          {partnerAction}
                        </span>
                      </div>

                      <h2 className="serif-font text-2xl sm:text-3xl font-bold text-white mb-4 leading-snug">
                        {currentCard.title}
                      </h2>

                      <p className="text-gray-300 text-sm leading-relaxed max-h-36 overflow-y-auto pr-1">
                        {currentCard.description}
                      </p>
                    </div>

                    {/* Timer Section */}
                    <div className="mt-4 flex flex-col items-center justify-center">
                      {!timerActive ? (
                        <div className="text-center">
                          <p className="text-gray-400 text-xs uppercase mb-1">Recommended time</p>
                          <p className="text-3xl font-bold gradient-pink bg-clip-text text-transparent mb-3">
                            {formatTime(currentCard.timer)}
                          </p>
                          <button
                            onClick={onStartTimer}
                            className="gradient-pink text-white px-6 py-2.5 rounded-full font-bold text-sm hover:shadow-lg hover:shadow-pink-500/50 transition-all cursor-pointer"
                          >
                            Start Timer
                          </button>
                        </div>
                      ) : (
                        <div className="text-center">
                          <svg className="progress-ring w-28 h-28 mx-auto" width="120" height="120">
                            <circle
                              className="progress-ring-circle"
                              stroke="currentColor"
                              strokeWidth="4"
                              fill="transparent"
                              r="45"
                              cx="60"
                              cy="60"
                              style={{ strokeDasharray: circumference, strokeDashoffset }}
                            />
                            <text
                              x="60"
                              y="60"
                              textAnchor="middle"
                              dy="0.3em"
                              className="text-xl font-bold"
                              fill="#ec4899"
                            >
                              {formatTime(timeRemaining)}
                            </text>
                          </svg>
                        </div>
                      )}
                    </div>
                  </div>

                </div>
              </div>

              {/* Action Buttons */}
              <div className="flex flex-col items-center gap-2">
                <div className="flex gap-6 justify-center items-center">
                  <button
                    onClick={isCardFlipped ? onSkip : onFlipCard}
                    className="action-button skip"
                    title={isCardFlipped ? "Skip Task" : "Reveal Card First"}
                  >
                    ↻
                  </button>
                  <button
                    onClick={isCardFlipped ? onComplete : onFlipCard}
                    className="action-button love"
                    title={isCardFlipped ? "Complete Task" : "Reveal Card First"}
                  >
                    ♥
                  </button>
                </div>
                
                <p className="text-xs text-gray-400">
                  {!isCardFlipped 
                    ? "👆 Tap card to flip & reveal task" 
                    : "Tap ♥ when completed (turns will switch)"}
                </p>
              </div>

              {/* Stats */}
              <div className="text-center text-gray-400 text-xs">
                <p>{totalCompleted} tasks completed in total</p>
              </div>
            </div>
          );
        }

        function SectionCompleteScreen({ sectionNum, totalCompleted, nextSection, sectionNames }) {
          return (
            <div className="w-full max-w-md mx-auto slide-up">
              <div className="onboarding-content p-10 text-center">
                <div className="section-complete-illustration">🎉</div>
                <h2 className="serif-font text-4xl font-bold mb-2 bg-gradient-to-r from-pink-300 to-rose-400 bg-clip-text text-transparent">
                  Excellent!
                </h2>
                <p className="text-gray-300 mb-6">
                  Section {sectionNum} ({sectionNames[sectionNum]}) complete
                </p>
                <div className="bg-black/30 rounded-lg p-6 mb-8 border border-pink-500/20">
                  <p className="text-3xl font-bold text-pink-300 mb-2">{totalCompleted}</p>
                  <p className="text-gray-400 text-sm">tasks completed so far</p>
                </div>
                <button
                  onClick={nextSection}
                  className="w-full gradient-pink text-white py-4 rounded-full font-bold hover:shadow-lg hover:shadow-pink-500/50 transition-all cursor-pointer"
                >
                  {sectionNum < 5 ? `Continue to Section ${sectionNum + 1}` : 'View Summary'}
                </button>
              </div>
            </div>
          );
        }

        function GameCompleteScreen({ totalCompleted, resetGame }) {
          return (
            <div className="w-full max-w-md mx-auto slide-up">
              <div className="onboarding-content p-10 text-center">
                <div className="section-complete-illustration">✨</div>
                <h2 className="serif-font text-4xl font-bold mb-4 bg-gradient-to-r from-pink-300 via-pink-400 to-rose-400 bg-clip-text text-transparent">
                  Journey Complete
                </h2>
                <div className="bg-black/30 rounded-lg p-6 mb-6 border border-pink-500/20">
                  <p className="text-4xl font-bold text-pink-300 mb-2">🏆</p>
                  <p className="text-2xl font-bold text-white mb-1">{totalCompleted}</p>
                  <p className="text-gray-400 text-xs mb-3">Tasks Completed</p>
                  <p className="text-gray-300 text-xs leading-relaxed">
                    You've explored all 5 sections of intimate connection. You've created trust, communication, and genuine intimacy together.
                  </p>
                </div>
                <button
                  onClick={resetGame}
                  className="w-full gradient-pink text-white py-3.5 rounded-full font-bold hover:shadow-lg hover:shadow-pink-500/50 transition-all cursor-pointer"
                >
                  Play Again
                </button>
              </div>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

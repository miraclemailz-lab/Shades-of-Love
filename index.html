<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>69 Shades of Play - Extended Edition</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #2d1b2e 0%, #1a0f2e 50%, #0f0a1a 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        .serif-font {
            font-family: 'Georgia', 'Garamond', serif;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardSwipeLeft {
            to {
                opacity: 0;
                transform: translateX(-500px) rotate(-20deg);
            }
        }

        @keyframes cardSwipeRight {
            to {
                opacity: 0;
                transform: translateX(500px) rotate(20deg);
            }
        }

        @keyframes pop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .slide-up {
            animation: slideInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .swipe-left {
            animation: cardSwipeLeft 0.5s ease-out forwards;
        }

        .swipe-right {
            animation: cardSwipeRight 0.5s ease-out forwards;
        }

        .pop-animation {
            animation: pop 0.4s ease-out;
        }

        .gradient-pink {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
        }

        .gradient-dark {
            background: linear-gradient(135deg, #1a0f2e 0%, #2d1b2e 100%);
        }

        .card-container {
            perspective: 1000px;
        }

        .task-card {
            background: linear-gradient(135deg, rgba(45, 27, 46, 0.95) 0%, rgba(26, 15, 46, 0.95) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(236, 72, 153, 0.2);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .task-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.1) 0%, transparent 50%, rgba(219, 39, 119, 0.05) 100%);
            pointer-events: none;
        }

        .panic-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            border: 2px solid #fca5a5;
            color: white;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.4);
        }

        .panic-button:hover {
            transform: scale(1.15);
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.6);
        }

        .action-button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-button.skip {
            background: rgba(100, 100, 100, 0.8);
            border: 2px solid rgba(150, 150, 150, 0.5);
        }

        .action-button.skip:hover {
            background: rgba(120, 120, 120, 0.9);
            transform: scale(1.1);
        }

        .action-button.love {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            border: 2px solid #f472b6;
        }

        .action-button.love:hover {
            transform: scale(1.15);
            box-shadow: 0 15px 40px rgba(236, 72, 153, 0.5);
        }

        .action-button.next {
            background: rgba(80, 80, 120, 0.8);
            border: 2px solid rgba(150, 150, 200, 0.5);
        }

        .action-button.next:hover {
            background: rgba(100, 100, 150, 0.9);
            transform: scale(1.1);
        }

        .timer-display {
            font-size: 14px;
            color: #ec4899;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(236, 72, 153, 0.2);
            color: #f472b6;
            border: 1px solid rgba(236, 72, 153, 0.4);
        }

        .intensity-indicator {
            display: flex;
            gap: 6px;
        }

        .intensity-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(236, 72, 153, 0.3);
            transition: all 0.3s ease;
        }

        .intensity-dot.active {
            background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.6);
        }

        .progress-ring {
            transform: rotate(-90deg);
        }

        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s;
            stroke: #ec4899;
            fill: transparent;
        }

        .onboarding-content {
            background: linear-gradient(135deg, rgba(45, 27, 46, 0.9) 0%, rgba(26, 15, 46, 0.9) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(236, 72, 153, 0.2);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .section-complete-illustration {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pop 0.6s ease-out;
        }

        @media (max-width: 768px) {
            .action-button {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }

            .panic-button {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
          const [gameState, setGameState] = useState('onboarding');
          const [currentSection, setCurrentSection] = useState(1);
          const [completedTasksInSection, setCompletedTasksInSection] = useState(0);
          const [availableCards, setAvailableCards] = useState([]);
          const [currentCard, setCurrentCard] = useState(null);
          const [timerActive, setTimerActive] = useState(false);
          const [timeRemaining, setTimeRemaining] = useState(0);
          const [totalCompleted, setTotalCompleted] = useState(0);
          const [allCards, setAllCards] = useState([]);
          const [cardAnimation, setCardAnimation] = useState(null);
          const timerRef = useRef(null);

          useEffect(() => {
            const loadCards = async () => {
              try {
                const response = await fetch('cards.json');
                const data = await response.json();
                const allCardsArray = [
                  ...data.section_1_love_romantic,
                  ...data.section_2_hug_kisses,
                  ...data.section_3_strip_playful,
                  ...data.section_4_fantasy_extended_play,
                  ...data.section_5_intense_aftercare
                ];
                setAllCards(allCardsArray);
              } catch (error) {
                console.error('Failed to load cards:', error);
                alert('Could not load cards. Please refresh the page.');
              }
            };
            loadCards();
          }, []);

          useEffect(() => {
            if (timerActive && timeRemaining > 0) {
              timerRef.current = setTimeout(() => {
                setTimeRemaining(prev => prev - 1);
              }, 1000);
            } else if (timeRemaining === 0 && timerActive) {
              setTimerActive(false);
            }
            return () => clearTimeout(timerRef.current);
          }, [timerActive, timeRemaining]);

          const initializeSection = (sectionNum) => {
            const sectionCards = allCards.filter(c => c.section === sectionNum);
            const shuffled = [...sectionCards].sort(() => Math.random() - 0.5);
            setAvailableCards(shuffled);
            setCurrentCard(shuffled[0]);
            setCompletedTasksInSection(0);
            setCurrentSection(sectionNum);
          };

          const startGame = () => {
            if (allCards.length === 0) {
              alert('Cards not loaded yet. Please refresh.');
              return;
            }
            initializeSection(1);
            setGameState('playing');
            setTotalCompleted(0);
          };

          const handleSkip = () => {
            setCardAnimation('skip');
            setTimeout(() => {
              const remaining = availableCards.slice(1);
              const reshuffled = [...remaining, currentCard].sort(() => Math.random() - 0.5);
              setAvailableCards(reshuffled);
              setCurrentCard(reshuffled[0]);
              setCardAnimation(null);
              setTimerActive(false);
            }, 500);
          };

          const handleComplete = () => {
            setCardAnimation('complete');
            setTimeout(() => {
              setTimerActive(false);
              setCompletedTasksInSection(prev => prev + 1);
              setTotalCompleted(prev => prev + 1);

              const remaining = availableCards.slice(1);
              if (remaining.length === 0 || completedTasksInSection + 1 >= 10) {
                setGameState('sectionComplete');
              } else {
                setCurrentCard(remaining[0]);
                setAvailableCards(remaining);
                setCardAnimation(null);
              }
            }, 500);
          };

          const nextSection = () => {
            if (currentSection < 5) {
              initializeSection(currentSection + 1);
              setGameState('playing');
            } else {
              setGameState('gameComplete');
            }
          };

          const panicClick = () => {
            if (confirm('Close game?')) {
              window.location.href = 'https://www.google.com';
            }
          };

          const resetGame = () => {
            setGameState('onboarding');
            setCurrentSection(1);
            setCompletedTasksInSection(0);
            setTotalCompleted(0);
          };

          const formatTime = (seconds) => {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
          };

          const sectionNames = {
            1: 'Love & Romantic',
            2: 'Hug & Kisses',
            3: 'Strip & Playful',
            4: 'Fantasy & Extended',
            5: 'Intense & Aftercare'
          };

          return (
            <div className="min-h-screen w-full flex items-center justify-center p-4 gradient-dark">
              <button onClick={panicClick} className="panic-button">✕</button>

              {gameState === 'onboarding' && (
                <OnboardingScreen startGame={startGame} />
              )}

              {gameState === 'playing' && currentCard && (
                <PlayingScreen
                  currentCard={currentCard}
                  currentSection={currentSection}
                  completedInSection={completedTasksInSection}
                  totalCompleted={totalCompleted}
                  cardAnimation={cardAnimation}
                  timerActive={timerActive}
                  timeRemaining={timeRemaining}
                  onSkip={handleSkip}
                  onComplete={handleComplete}
                  onStartTimer={() => {
                    setTimeRemaining(currentCard.timer);
                    setTimerActive(true);
                  }}
                  formatTime={formatTime}
                  sectionNames={sectionNames}
                />
              )}

              {gameState === 'sectionComplete' && (
                <SectionCompleteScreen
                  sectionNum={currentSection}
                  totalCompleted={totalCompleted}
                  nextSection={nextSection}
                  sectionNames={sectionNames}
                />
              )}

              {gameState === 'gameComplete' && (
                <GameCompleteScreen totalCompleted={totalCompleted} resetGame={resetGame} />
              )}
            </div>
          );
        }

        function OnboardingScreen({ startGame }) {
          const [confirmed, setConfirmed] = useState(false);

          return (
            <div className="w-full max-w-md mx-auto slide-up">
              <div className="onboarding-content p-8 text-center">
                <div className="mb-6">
                  <h1 className="serif-font text-5xl font-bold mb-2 bg-gradient-to-r from-pink-300 via-pink-400 to-rose-400 bg-clip-text text-transparent">
                    69 Shades
                  </h1>
                  <p className="text-pink-300 text-sm tracking-widest uppercase font-semibold">of Play</p>
                </div>

                <div className="space-y-4 text-left mb-8">
                  <p className="text-gray-300 text-sm leading-relaxed">
                    A journey of intimacy, trust, and connection. Explore <strong>5 progressive sections</strong> with <strong>80 cards each</strong>.
                  </p>
                  <ul className="text-gray-400 text-xs space-y-2 ml-4">
                    <li>💜 <strong>Love & Romantic</strong> - Emotional moments</li>
                    <li>💋 <strong>Hug & Kisses</strong> - Touch & affection</li>
                    <li>✨ <strong>Strip & Playful</strong> - Vulnerability</li>
                    <li>🔥 <strong>Fantasy & Extended</strong> - Passion</li>
                    <li>💥 <strong>Intense & Aftercare</strong> - Peak intimacy</li>
                  </ul>
                </div>

                <div className="flex items-start gap-3 mb-8 bg-black/30 p-4 rounded-lg border border-pink-500/20">
                  <input
                    type="checkbox"
                    id="ageConfirm"
                    checked={confirmed}
                    onChange={(e) => setConfirmed(e.target.checked)}
                    className="w-5 h-5 rounded accent-pink-500 mt-1"
                  />
                  <label htmlFor="ageConfirm" className="text-xs text-gray-400">
                    I confirm I am 18+ and ready to explore intimacy responsibly with my partner.
                  </label>
                </div>

                <button
                  onClick={startGame}
                  disabled={!confirmed}
                  className={`w-full py-4 rounded-full font-bold text-lg transition-all ${
                    confirmed
                      ? 'gradient-pink text-white hover:shadow-lg hover:shadow-pink-500/50'
                      : 'bg-gray-700 text-gray-400 cursor-not-allowed'
                  }`}
                >
                  Get Started ➜
                </button>
              </div>
            </div>
          );
        }

        function PlayingScreen({ currentCard, currentSection, completedInSection, totalCompleted, cardAnimation, timerActive, timeRemaining, onSkip, onComplete, onStartTimer, formatTime, sectionNames }) {
          const circumference = 2 * Math.PI * 45;
          const strokeDashoffset = circumference - (timeRemaining / currentCard.timer) * circumference;
          const intensityDots = Array(5).fill(0).map((_, i) => i < (currentCard.intensity || 2));

          return (
            <div className="w-full max-w-md mx-auto flex flex-col items-center justify-center gap-8">
              {/* Progress & Section Info */}
              <div className="w-full">
                <div className="flex justify-between items-center mb-4">
                  <span className="badge">{sectionNames[currentSection]}</span>
                  <span className="text-xs text-gray-400">Task {completedInSection}/10</span>
                </div>
                <div className="w-full h-1 bg-gray-800 rounded-full overflow-hidden border border-pink-500/20">
                  <div 
                    className="h-full gradient-pink transition-all duration-300"
                    style={{ width: `${(completedInSection / 10) * 100}%` }}
                  ></div>
                </div>
              </div>

              {/* Card */}
              <div className={`w-full ${cardAnimation ? (cardAnimation === 'skip' ? 'swipe-left' : 'swipe-right') : ''}`}>
                <div className="task-card p-10 min-h-96 flex flex-col justify-between relative">
                  {/* Top Section */}
                  <div>
                    <div className="flex items-center justify-between mb-6">
                      <span className="timer-display">{currentCard.category}</span>
                      <div className="intensity-indicator">
                        {intensityDots.map((active, i) => (
                          <div key={i} className={`intensity-dot ${active ? 'active' : ''}`}></div>
                        ))}
                      </div>
                    </div>

                    <h2 className="serif-font text-3xl font-bold text-white mb-6 leading-tight">
                      {currentCard.title}
                    </h2>

                    <p className="text-gray-300 text-sm leading-relaxed line-clamp-4">
                      {currentCard.description}
                    </p>
                  </div>

                  {/* Timer Section */}
                  <div className="mt-8 flex flex-col items-center justify-center">
                    {!timerActive ? (
                      <div className="text-center">
                        <p className="text-gray-400 text-xs uppercase mb-3">Recommended time</p>
                        <p className="text-4xl font-bold gradient-pink bg-clip-text text-transparent mb-4">
                          {formatTime(currentCard.timer)}
                        </p>
                        <button
                          onClick={onStartTimer}
                          className="gradient-pink text-white px-8 py-3 rounded-full font-bold text-sm hover:shadow-lg hover:shadow-pink-500/50 transition-all"
                        >
                          Start Timer
                        </button>
                      </div>
                    ) : (
                      <div className="text-center">
                        <svg className="progress-ring w-32 h-32 mx-auto" width="140" height="140">
                          <circle
                            className="progress-ring-circle"
                            stroke="currentColor"
                            strokeWidth="4"
                            fill="transparent"
                            r="45"
                            cx="70"
                            cy="70"
                            style={{ strokeDasharray: circumference, strokeDashoffset }}
                          />
                          <text
                            x="70"
                            y="70"
                            textAnchor="middle"
                            dy="0.3em"
                            className="text-2xl font-bold"
                            fill="#ec4899"
                          >
                            {formatTime(timeRemaining)}
                          </text>
                        </svg>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              {/* Action Buttons */}
              <div className="flex gap-6 justify-center items-center">
                <button onClick={onSkip} className="action-button skip" title="Skip">
                  ↻
                </button>
                <button onClick={onComplete} className="action-button love" title="Complete">
                  ♥
                </button>
              </div>

              {/* Stats */}
              <div className="text-center text-gray-400 text-sm">
                <p>{totalCompleted} tasks completed</p>
              </div>
            </div>
          );
        }

        function SectionCompleteScreen({ sectionNum, totalCompleted, nextSection, sectionNames }) {
          return (
            <div className="w-full max-w-md mx-auto slide-up">
              <div className="onboarding-content p-12 text-center">
                <div className="section-complete-illustration">🎉</div>
                <h2 className="serif-font text-4xl font-bold mb-2 bg-gradient-to-r from-pink-300 to-rose-400 bg-clip-text text-transparent">
                  Excellent!
                </h2>
                <p className="text-gray-300 mb-6">
                  Section {sectionNum} complete
                </p>
                <div className="bg-black/30 rounded-lg p-6 mb-8 border border-pink-500/20">
                  <p className="text-2xl font-bold text-pink-300 mb-2">{totalCompleted}</p>
                  <p className="text-gray-400 text-sm">tasks completed so far</p>
                </div>
                <button
                  onClick={nextSection}
                  className="w-full gradient-pink text-white py-4 rounded-full font-bold hover:shadow-lg hover:shadow-pink-500/50 transition-all"
                >
                  {sectionNum < 5 ? `Continue to Section ${sectionNum + 1}` : 'View Summary'}
                </button>
              </div>
            </div>
          );
        }

        function GameCompleteScreen({ totalCompleted, resetGame }) {
          return (
            <div className="w-full max-w-md mx-auto slide-up">
              <div className="onboarding-content p-12 text-center">
                <div className="section-complete-illustration">✨</div>
                <h2 className="serif-font text-4xl font-bold mb-6 bg-gradient-to-r from-pink-300 via-pink-400 to-rose-400 bg-clip-text text-transparent">
                  Journey Complete
                </h2>
                <div className="bg-black/30 rounded-lg p-8 mb-8 border border-pink-500/20">
                  <p className="text-5xl font-bold text-pink-300 mb-2">🏆</p>
                  <p className="text-2xl font-bold text-white mb-2">{totalCompleted}</p>
                  <p className="text-gray-400 text-sm mb-4">Tasks Completed</p>
                  <p className="text-gray-400 text-xs leading-relaxed">
                    You've explored all 5 sections of intimate connection. You've created trust, communication, and genuine intimacy together.
                  </p>
                </div>
                <div className="space-y-3">
                  <button
                    onClick={resetGame}
                    className="w-full gradient-pink text-white py-3 rounded-full font-bold hover:shadow-lg hover:shadow-pink-500/50 transition-all"
                  >
                    Play Again
                  </button>
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

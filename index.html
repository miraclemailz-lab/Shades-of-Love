<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>69 Shades of Play - Extended Edition</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1b2e 100%);
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .serif-font {
            font-family: 'Georgia', 'Garamond', serif;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse-gentle {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .slide-up {
            animation: slideInUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .pulse-subtle {
            animation: pulse-gentle 2s ease-in-out infinite;
        }

        .glass-card {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .glass-button {
            background: rgba(168, 85, 247, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease;
        }

        .glass-button:hover {
            background: rgba(168, 85, 247, 0.3);
            border-color: rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
        }

        .timer-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #8b5cf6 0deg,
                #8b5cf6 var(--progress),
                rgba(168, 85, 247, 0.1) var(--progress),
                rgba(168, 85, 247, 0.1) 360deg
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #8b5cf6;
            font-size: 32px;
        }

        .panic-button {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 9999;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(220, 38, 38, 0.8);
            border: 2px solid rgba(220, 38, 38, 1);
            color: white;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .panic-button:hover {
            background: rgba(220, 38, 38, 1);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
        }

        .progress-bar {
            height: 4px;
            background: linear-gradient(90deg, #8b5cf6, #d946ef);
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .section-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-1 { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; }
        .section-2 { background: rgba(236, 72, 153, 0.2); color: #fbcfe8; }
        .section-3 { background: rgba(239, 68, 68, 0.2); color: #fecaca; }
        .section-4 { background: rgba(217, 119, 6, 0.2); color: #fed7aa; }
        .section-5 { background: rgba(168, 85, 246, 0.2); color: #ddd6fe; }

        .intensity-dots {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .intensity-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.4);
        }

        .intensity-dot.active {
            background: #8b5cf6;
        }

        .task-text {
            font-size: 18px;
            line-height: 1.6;
            color: #e0e0e0;
            margin: 20px 0;
        }

        @keyframes countDown {
            0% { transform: scale(1.1); opacity: 1; }
            50% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        .timer-active {
            animation: countDown 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Main App Component
        function App() {
          const [gameState, setGameState] = useState('onboarding');
          const [ageConfirmed, setAgeConfirmed] = useState(false);
          const [currentSection, setCurrentSection] = useState(1);
          const [completedTasksInSection, setCompletedTasksInSection] = useState(0);
          const [availableCards, setAvailableCards] = useState([]);
          const [currentCard, setCurrentCard] = useState(null);
          const [discardedCards, setDiscardedCards] = useState([]);
          const [timerActive, setTimerActive] = useState(false);
          const [timeRemaining, setTimeRemaining] = useState(0);
          const [totalCompleted, setTotalCompleted] = useState(0);
          const [completedSections, setCompletedSections] = useState(new Set());
          const [allCards, setAllCards] = useState([]);
          const timerRef = useRef(null);

          // Load cards from JSON
          useEffect(() => {
            const loadCards = async () => {
              try {
                const response = await fetch('cards.json');
                const data = await response.json();
                const allCardsArray = [
                  ...data.section_1_love_romantic,
                  ...data.section_2_hug_kisses,
                  ...data.section_3_strip_playful,
                  ...data.section_4_fantasy_extended_play,
                  ...data.section_5_intense_aftercare
                ];
                setAllCards(allCardsArray);
              } catch (error) {
                console.error('Failed to load cards:', error);
                alert('Could not load cards. Please refresh the page.');
              }
            };
            loadCards();
          }, []);

          // Timer effect
          useEffect(() => {
            if (timerActive && timeRemaining > 0) {
              timerRef.current = setTimeout(() => {
                setTimeRemaining(prev => prev - 1);
              }, 1000);
            } else if (timeRemaining === 0 && timerActive) {
              setTimerActive(false);
              alert('Time is up! Mark as complete or skip to continue.');
            }
            return () => clearTimeout(timerRef.current);
          }, [timerActive, timeRemaining]);

          const initializeSection = (sectionNum) => {
            const sectionCards = allCards.filter(c => c.section === sectionNum);
            const shuffled = [...sectionCards].sort(() => Math.random() - 0.5);
            setAvailableCards(shuffled);
            setCurrentCard(shuffled[0]);
            setCompletedTasksInSection(0);
            setDiscardedCards([]);
            setCurrentSection(sectionNum);
          };

          const startGame = () => {
            if (allCards.length === 0) {
              alert('Cards not loaded yet. Please refresh.');
              return;
            }
            initializeSection(1);
            setGameState('playing');
            setTotalCompleted(0);
          };

          const startTimer = () => {
            if (currentCard) {
              setTimeRemaining(currentCard.timer);
              setTimerActive(true);
            }
          };

          const completeCard = () => {
            setTimerActive(false);
            setCompletedTasksInSection(prev => prev + 1);
            setTotalCompleted(prev => prev + 1);
            setDiscardedCards(prev => [...prev, currentCard]);

            const remaining = availableCards.slice(1);
            if (remaining.length === 0 || completedTasksInSection + 1 >= 10) {
              setCompletedSections(prev => new Set([...prev, currentSection]));
              setGameState('sectionComplete');
            } else {
              setCurrentCard(remaining[0]);
              setAvailableCards(remaining);
            }
          };

          const skipCard = () => {
            setTimerActive(false);
            const remaining = availableCards.slice(1);
            const reshuffled = [...remaining, currentCard].sort(() => Math.random() - 0.5);
            setAvailableCards(reshuffled);
            setCurrentCard(reshuffled[0]);
          };

          const nextSection = () => {
            if (currentSection < 5) {
              initializeSection(currentSection + 1);
              setGameState('playing');
            } else {
              setGameState('gameComplete');
            }
          };

          const panicClick = () => {
            if (confirm('This will close the game. Are you sure?')) {
              window.location.href = 'https://www.google.com';
            }
          };

          const resetGame = () => {
            setGameState('onboarding');
            setAgeConfirmed(false);
            setCurrentSection(1);
            setCompletedTasksInSection(0);
            setTotalCompleted(0);
            setCompletedSections(new Set());
          };

          const timerPercentage = currentCard ? ((currentCard.timer - timeRemaining) / currentCard.timer) * 100 : 0;

          return (
            <div className="min-h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-black">
              <button onClick={panicClick} className="panic-button" title="Quick Close">✕</button>

              {gameState === 'onboarding' && (
                <OnboardingScreen setGameState={setGameState} setAgeConfirmed={setAgeConfirmed} startGame={startGame} />
              )}

              {gameState === 'playing' && currentCard && (
                <PlayingScreen
                  currentCard={currentCard}
                  currentSection={currentSection}
                  completedInSection={completedTasksInSection}
                  totalCompleted={totalCompleted}
                  timerActive={timerActive}
                  timeRemaining={timeRemaining}
                  timerMax={currentCard.timer}
                  timerPercentage={timerPercentage}
                  onStartTimer={startTimer}
                  onComplete={completeCard}
                  onSkip={skipCard}
                />
              )}

              {gameState === 'sectionComplete' && (
                <SectionCompleteScreen
                  sectionNum={currentSection}
                  totalCompleted={totalCompleted}
                  nextSection={nextSection}
                />
              )}

              {gameState === 'gameComplete' && (
                <GameCompleteScreen totalCompleted={totalCompleted} resetGame={resetGame} />
              )}
            </div>
          );
        }

        // Onboarding Screen
        function OnboardingScreen({ setGameState, setAgeConfirmed, startGame }) {
          const [confirmed, setConfirmed] = useState(false);

          const handleProceed = () => {
            if (confirmed) {
              setAgeConfirmed(true);
              startGame();
            }
          };

          return (
            <div className="flex items-center justify-center min-h-screen px-4">
              <div className="glass-card p-12 max-w-2xl w-full slide-up">
                <h1 className="serif-font text-5xl font-bold text-center mb-4 bg-gradient-to-r from-purple-300 via-pink-300 to-red-300 bg-clip-text text-transparent">
                  69 Shades of Play
                </h1>
                <p className="text-center text-sm text-gray-300 mb-8">Extended Edition - 360 Cards for Infinite Exploration</p>

                <div className="bg-black/40 rounded-lg p-8 mb-8 border border-purple-500/20">
                  <h2 className="serif-font text-2xl font-semibold mb-6 text-purple-300">Welcome, Beautiful Souls</h2>
                  <div className="space-y-4 text-sm text-gray-300 leading-relaxed">
                    <p>You're about to embark on a journey of intimacy, trust, and deep connection. This game guides you through <strong>5 progressive sections</strong> with <strong>80 cards each (360 total)</strong>:</p>
                    <ul className="list-disc list-inside space-y-2 ml-4">
                      <li><strong>Section 1: Love & Romantic</strong> - Emotional connection and tender moments</li>
                      <li><strong>Section 2: Hug & Kisses</strong> - Touch and affection exploration</li>
                      <li><strong>Section 3: Strip & Playful</strong> - Vulnerability and sensuality</li>
                      <li><strong>Section 4: Fantasy & Extended Play</strong> - Passion and imagination</li>
                      <li><strong>Section 5: Intense & Aftercare</strong> - Peak intimacy and emotional care</li>
                    </ul>
                    <p className="pt-4"><strong>How It Works:</strong> Complete at least 10 random tasks per section with timed challenges. Skip tasks you're not comfortable with. Progress through all 5 sections for a complete experience.</p>
                    <p className="text-xs text-gray-400 pt-4">All data stays on your device. 100% private. Built for couples seeking genuine connection.</p>
                  </div>
                </div>

                <div className="flex items-center mb-8">
                  <input
                    type="checkbox"
                    id="ageConfirm"
                    checked={confirmed}
                    onChange={(e) => setConfirmed(e.target.checked)}
                    className="w-5 h-5 rounded accent-purple-500"
                  />
                  <label htmlFor="ageConfirm" className="ml-4 text-sm text-gray-300">
                    I confirm I am 18+ and ready to explore intimacy responsibly.
                  </label>
                </div>

                <button
                  onClick={handleProceed}
                  disabled={!confirmed}
                  className={`w-full py-4 rounded-lg font-semibold text-lg transition-all ${
                    confirmed
                      ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white hover:shadow-lg hover:shadow-purple-500/50'
                      : 'bg-gray-700 text-gray-400 cursor-not-allowed'
                  }`}
                >
                  Begin Your Journey
                </button>
              </div>
            </div>
          );
        }

        // Playing Screen
        function PlayingScreen({ currentCard, currentSection, completedInSection, totalCompleted, timerActive, timeRemaining, timerMax, timerPercentage, onStartTimer, onComplete, onSkip }) {
          const formatTime = (seconds) => {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
          };

          const sectionColors = {
            1: 'section-1',
            2: 'section-2',
            3: 'section-3',
            4: 'section-4',
            5: 'section-5'
          };

          const sectionNames = {
            1: 'Love & Romantic',
            2: 'Hug & Kisses',
            3: 'Strip & Playful',
            4: 'Fantasy & Extended',
            5: 'Intense & Aftercare'
          };

          const intensityDots = Array(5).fill(0).map((_, i) => i < currentCard.intensity);

          return (
            <div className="min-h-screen flex flex-col items-center justify-center p-4 py-12">
              <div className="w-full max-w-2xl mb-12">
                <div className="flex items-center justify-between mb-6">
                  <div>
                    <span className={`section-badge ${sectionColors[currentSection]}`}>
                      Section {currentSection}: {sectionNames[currentSection]}
                    </span>
                    <p className="text-gray-400 text-sm mt-2">Task {completedInSection} / 10 in this section</p>
                  </div>
                  <div className="text-right">
                    <p className="text-gray-300 text-lg font-semibold">{totalCompleted} Total Completed</p>
                  </div>
                </div>

                <div className="mb-2 bg-black/30 rounded-full h-2 overflow-hidden border border-purple-500/20">
                  <div className="progress-bar" style={{ width: `${(completedInSection / 10) * 100}%` }}></div>
                </div>
              </div>

              {currentCard && (
                <div className="w-full max-w-2xl mb-12">
                  <div className="glass-card p-10 rounded-3xl slide-up">
                    <div className="mb-6">
                      <p className="text-purple-400 text-sm uppercase tracking-widest font-semibold mb-3">
                        {currentCard.category}
                      </p>
                      <h2 className="serif-font text-4xl font-bold text-white mb-4">{currentCard.title}</h2>
                      <div className="flex gap-1">
                        {intensityDots.map((active, i) => (
                          <div key={i} className={`intensity-dot ${active ? 'active' : ''}`}></div>
                        ))}
                      </div>
                    </div>

                    <p className="task-text text-gray-200 leading-relaxed mb-8">
                      {currentCard.description}
                    </p>

                    <div className="bg-black/50 rounded-2xl p-8 border border-purple-500/20 text-center mb-8">
                      {!timerActive ? (
                        <div>
                          <p className="text-gray-400 text-sm mb-4">Recommended time for this task:</p>
                          <p className="text-5xl font-bold text-purple-400 mb-6">{formatTime(timerMax)}</p>
                          <button
                            onClick={onStartTimer}
                            className="px-8 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg font-semibold hover:shadow-lg hover:shadow-purple-500/50 transition-all"
                          >
                            Start Timer
                          </button>
                        </div>
                      ) : (
                        <div>
                          <p className="text-gray-400 text-sm mb-4">Time Remaining</p>
                          <div className="timer-circle timer-active mx-auto mb-6" style={{ '--progress': `${timerPercentage}%` }}>
                            {formatTime(timeRemaining)}
                          </div>
                        </div>
                      )}
                    </div>

                    <div className="flex gap-4">
                      <button
                        onClick={onComplete}
                        className="flex-1 py-3 bg-gradient-to-r from-green-600 to-emerald-600 text-white rounded-lg font-semibold hover:shadow-lg hover:shadow-green-500/50 transition-all"
                      >
                        ✓ Complete Task
                      </button>
                      <button
                        onClick={onSkip}
                        className="flex-1 py-3 bg-gradient-to-r from-gray-600 to-gray-700 text-white rounded-lg font-semibold hover:shadow-lg hover:shadow-gray-500/50 transition-all"
                      >
                        ↻ Skip Task
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        // Section Complete Screen
        function SectionCompleteScreen({ sectionNum, totalCompleted, nextSection }) {
          const sectionNames = {
            1: 'Love & Romantic',
            2: 'Hug & Kisses',
            3: 'Strip & Playful',
            4: 'Fantasy & Extended',
            5: 'Intense & Aftercare'
          };

          const nextSectionName = sectionNum < 5 ? sectionNames[sectionNum + 1] : 'Game Complete!';

          return (
            <div className="flex items-center justify-center min-h-screen px-4">
              <div className="glass-card p-12 max-w-2xl w-full text-center slide-up">
                <h2 className="serif-font text-5xl font-bold mb-6 bg-gradient-to-r from-purple-300 to-pink-300 bg-clip-text text-transparent">
                  🎉 Section Complete!
                </h2>
                <p className="text-gray-300 text-lg mb-8">
                  You've completed <strong>Section {sectionNum}: {sectionNames[sectionNum]}</strong>
                </p>

                <div className="bg-black/40 rounded-lg p-8 mb-8 border border-purple-500/20">
                  <p className="text-gray-300 text-lg mb-4">
                    <strong>Total Tasks Completed: {totalCompleted}</strong>
                  </p>
                  {sectionNum < 5 ? (
                    <p className="text-gray-400">
                      Ready to explore <strong>{nextSectionName}</strong>? This next section takes your connection even deeper.
                    </p>
                  ) : (
                    <p className="text-gray-400">
                      You've completed all 5 sections! Amazing journey together.
                    </p>
                  )}
                </div>

                <button
                  onClick={nextSection}
                  className="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg font-semibold text-lg hover:shadow-lg hover:shadow-purple-500/50 transition-all"
                >
                  {sectionNum < 5 ? `Continue to Section ${sectionNum + 1}` : 'View Final Summary'}
                </button>
              </div>
            </div>
          );
        }

        // Game Complete Screen
        function GameCompleteScreen({ totalCompleted, resetGame }) {
          return (
            <div className="flex items-center justify-center min-h-screen px-4">
              <div className="glass-card p-12 max-w-2xl w-full text-center slide-up">
                <h2 className="serif-font text-5xl font-bold mb-6 bg-gradient-to-r from-purple-300 via-pink-300 to-red-300 bg-clip-text text-transparent">
                  ✨ Journey Complete ✨
                </h2>

                <div className="bg-black/40 rounded-lg p-8 mb-8 border border-purple-500/20">
                  <p className="text-gray-300 text-2xl font-bold mb-4">
                    🏆 {totalCompleted} Tasks Completed
                  </p>
                  <p className="text-gray-300 mb-6">
                    You've explored all 5 sections of intimate connection with your partner. You've shared vulnerability, passion, and deep affection. This journey has strengthened your bond.
                  </p>
                  <p className="text-gray-400 text-sm">
                    What you've created together—trust, communication, and genuine intimacy—is the real victory. These moments will echo in your relationship forever.
                  </p>
                </div>

                <div className="space-y-4">
                  <button
                    onClick={resetGame}
                    className="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg font-semibold text-lg hover:shadow-lg hover:shadow-purple-500/50 transition-all"
                  >
                    Play Again
                  </button>
                  <button
                    onClick={() => alert('Thank you for using 69 Shades of Play. Cherish these moments together.')}
                    className="w-full py-4 bg-gray-700 text-gray-300 rounded-lg font-semibold hover:bg-gray-600 transition-all"
                  >
                    Close Game
                  </button>
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>

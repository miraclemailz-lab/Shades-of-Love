<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Me Like You Do</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --theme-bg: linear-gradient(135deg, #180508 0%, #0f0205 50%, #050002 100%);
            --theme-primary: #ef4444;
            --theme-primary-dark: #b91c1c;
            --theme-glow: rgba(239, 68, 68, 0.45);
            --theme-border: rgba(239, 68, 68, 0.35);
            --theme-badge-bg: rgba(239, 68, 68, 0.18);
            --theme-badge-text: #fca5a5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #0d0408;
            color: #f1f1f1;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.6s ease;
        }

        .serif-font {
            font-family: 'Georgia', 'Garamond', 'Playfair Display', serif;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardSwipeLeft {
            to {
                opacity: 0;
                transform: translateX(-400px) rotate(-18deg);
            }
        }

        @keyframes cardSwipeRight {
            to {
                opacity: 0;
                transform: translateX(400px) rotate(18deg);
            }
        }

        @keyframes pop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 10px var(--theme-primary));
            }
            50% {
                transform: scale(1.06);
                filter: drop-shadow(0 0 25px var(--theme-primary));
            }
        }

        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% {
                transform: translateY(-20vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        .slide-up {
            animation: slideInUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .swipe-left {
            animation: cardSwipeLeft 0.45s ease-out forwards;
        }

        .swipe-right {
            animation: cardSwipeRight 0.45s ease-out forwards;
        }

        .pop-animation {
            animation: pop 0.4s ease-out;
        }

        .pulse-hint {
            animation: pulseGlow 2.4s infinite ease-in-out;
        }

        .floating-element {
            animation: floatSlow 4s infinite ease-in-out;
        }

        /* 3D Card Flip Architecture - Absolute Inset Alignment */
        .card-flip-container {
            perspective: 1200px;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
        }

        .card-flip-inner {
            position: relative;
            width: 100%;
            height: 520px;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.34, 1.35, 0.64, 1);
        }

        .card-flip-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 30px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.75rem;
            backdrop-filter: blur(20px);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .card-face-back {
            transform: rotateY(0deg);
            z-index: 2;
            cursor: pointer;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65), inset 0 0 35px rgba(255, 255, 255, 0.04);
        }

        .card-face-back::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, var(--theme-glow) 0%, transparent 60%);
            pointer-events: none;
            opacity: 0.45;
            animation: rotateSlow 30s linear infinite;
        }

        .card-face-back:hover {
            transform: scale(1.015);
            box-shadow: 0 25px 70px var(--theme-glow), inset 0 0 45px rgba(255, 255, 255, 0.08);
        }

        .card-face-front {
            transform: rotateY(180deg);
            z-index: 1;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .card-face-front::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--theme-glow) 0%, transparent 60%);
            opacity: 0.25;
            pointer-events: none;
        }

        /* Glassmorphism Onboarding & Setup Container */
        .onboarding-content {
            backdrop-filter: blur(24px);
            border-radius: 32px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

        /* Neon Ring Buttons (Inspired by Reference UI) */
        .neon-ring-btn {
            position: relative;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(18, 10, 20, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .neon-ring-btn::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid var(--theme-primary);
            opacity: 0.35;
            transition: all 0.3s ease;
        }

        .neon-ring-btn:hover {
            transform: scale(1.12);
            box-shadow: 0 12px 35px var(--theme-glow);
        }

        .neon-ring-btn:hover::after {
            inset: -6px;
            opacity: 0.95;
            box-shadow: 0 0 16px var(--theme-primary);
        }

        .neon-ring-btn.primary {
            background: var(--theme-bg);
            border-color: var(--theme-primary);
        }

        /* Swatch Bar Styles */
        .swatch-pill {
            backdrop-filter: blur(16px);
            background: rgba(15, 8, 18, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .swatch-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid transparent;
            position: relative;
        }

        .swatch-btn:hover {
            transform: scale(1.2);
        }

        .swatch-btn.active {
            transform: scale(1.3);
            border-color: #ffffff;
            box-shadow: 0 0 12px currentColor, inset 0 0 4px #ffffff;
        }

        /* Partner Setup Card */
        .partner-card {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(12px);
        }

        .partner-card:hover {
            transform: translateY(-4px) scale(1.03);
        }

        /* Progress Rings */
        .progress-ring {
            transform: rotate(-90deg);
        }

        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s ease;
            stroke: var(--theme-primary);
            fill: transparent;
        }

        /* Ambient floating particles */
        .ambient-particle {
            position: fixed;
            pointer-events: none;
            user-select: none;
            z-index: 0;
            animation: floatParticle linear infinite;
        }

        @media (max-width: 768px) {
            .neon-ring-btn {
                width: 58px;
                height: 58px;
                font-size: 22px;
            }

            .card-flip-inner {
                height: 490px;
            }

            .card-face {
                padding: 1.5rem 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Sensual Mood Themes inspired by Reference UI
        const THEMES = {
          crimson: {
            id: 'crimson',
            name: 'Crimson Passion',
            icon: '🔥',
            swatch: '#ef4444',
            bgGradient: 'linear-gradient(135deg, #180508 0%, #0f0205 50%, #050002 100%)',
            primary: '#ef4444',
            primaryDark: '#b91c1c',
            glow: 'rgba(239, 68, 68, 0.45)',
            border: 'rgba(239, 68, 68, 0.35)',
            badgeBg: 'rgba(239, 68, 68, 0.18)',
            badgeText: '#fca5a5',
            cardBackBg: 'linear-gradient(145deg, rgba(38, 10, 15, 0.97) 0%, rgba(18, 4, 8, 0.98) 100%)',
            cardFrontBg: 'linear-gradient(135deg, rgba(42, 12, 18, 0.97) 0%, rgba(20, 5, 9, 0.98) 100%)'
          },
          rose: {
            id: 'rose',
            name: 'Midnight Rose',
            icon: '💋',
            swatch: '#ec4899',
            bgGradient: 'linear-gradient(135deg, #240d21 0%, #15071a 50%, #09030d 100%)',
            primary: '#ec4899',
            primaryDark: '#db2777',
            glow: 'rgba(236, 72, 153, 0.45)',
            border: 'rgba(236, 72, 153, 0.35)',
            badgeBg: 'rgba(236, 72, 153, 0.18)',
            badgeText: '#f472b6',
            cardBackBg: 'linear-gradient(145deg, rgba(42, 15, 38, 0.97) 0%, rgba(20, 7, 24, 0.98) 100%)',
            cardFrontBg: 'linear-gradient(135deg, rgba(48, 18, 44, 0.97) 0%, rgba(24, 8, 28, 0.98) 100%)'
          },
          violet: {
            id: 'violet',
            name: 'Electric Orchid',
            icon: '💜',
            swatch: '#a855f7',
            bgGradient: 'linear-gradient(135deg, #19092c 0%, #0e051c 50%, #06020c 100%)',
            primary: '#a855f7',
            primaryDark: '#7e22ce',
            glow: 'rgba(168, 85, 247, 0.45)',
            border: 'rgba(168, 85, 247, 0.35)',
            badgeBg: 'rgba(168, 85, 247, 0.18)',
            badgeText: '#c084fc',
            cardBackBg: 'linear-gradient(145deg, rgba(32, 12, 54, 0.97) 0%, rgba(16, 6, 28, 0.98) 100%)',
            cardFrontBg: 'linear-gradient(135deg, rgba(38, 14, 62, 0.97) 0%, rgba(18, 7, 32, 0.98) 100%)'
          },
          gold: {
            id: 'gold',
            name: 'Royal Champagne',
            icon: '👑',
            swatch: '#f59e0b',
            bgGradient: 'linear-gradient(135deg, #1c1810 0%, #100e08 50%, #080704 100%)',
            primary: '#f59e0b',
            primaryDark: '#d97706',
            glow: 'rgba(245, 158, 11, 0.45)',
            border: 'rgba(245, 158, 11, 0.35)',
            badgeBg: 'rgba(245, 158, 11, 0.18)',
            badgeText: '#fde68a',
            cardBackBg: 'linear-gradient(145deg, rgba(42, 34, 18, 0.97) 0%, rgba(22, 17, 8, 0.98) 100%)',
            cardFrontBg: 'linear-gradient(135deg, rgba(48, 38, 20, 0.97) 0%, rgba(24, 19, 9, 0.98) 100%)'
          },
          ocean: {
            id: 'ocean',
            name: 'Sapphire Nights',
            icon: '🌊',
            swatch: '#06b6d4',
            bgGradient: 'linear-gradient(135deg, #091a2e 0%, #040e1c 50%, #02070f 100%)',
            primary: '#06b6d4',
            primaryDark: '#0284c7',
            glow: 'rgba(6, 182, 212, 0.45)',
            border: 'rgba(6, 182, 212, 0.35)',
            badgeBg: 'rgba(6, 182, 212, 0.18)',
            badgeText: '#67e8f9',
            cardBackBg: 'linear-gradient(145deg, rgba(12, 36, 58, 0.97) 0%, rgba(6, 18, 30, 0.98) 100%)',
            cardFrontBg: 'linear-gradient(135deg, rgba(14, 42, 68, 0.97) 0%, rgba(7, 21, 35, 0.98) 100%)'
          }
        };

        // Sensual Audio Synthesizer (Web Audio API)
        const playSensualSound = (type, enabled = true) => {
          if (!enabled) return;
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;
            
            if (type === 'flip') {
              // Smooth seductive dual-tone chime
              const osc1 = ctx.createOscillator();
              const osc2 = ctx.createOscillator();
              const gain = ctx.createGain();
              osc1.type = 'sine';
              osc2.type = 'triangle';
              osc1.frequency.setValueAtTime(432, now);
              osc1.frequency.exponentialRampToValueAtTime(648, now + 0.3);
              osc2.frequency.setValueAtTime(216, now);
              osc2.frequency.exponentialRampToValueAtTime(432, now + 0.3);
              gain.gain.setValueAtTime(0.12, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
              osc1.connect(gain);
              osc2.connect(gain);
              gain.connect(ctx.destination);
              osc1.start(now);
              osc2.start(now);
              osc1.stop(now + 0.5);
              osc2.stop(now + 0.5);
            } else if (type === 'complete') {
              // Harmonic celebration chord
              [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                gain.gain.setValueAtTime(0.08, now + idx * 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + idx * 0.05);
                osc.stop(now + 0.65);
              });
            }
          } catch (e) {
            // Audio context not allowed or unsupported
          }
        };

        function App() {
          const [gameState, setGameState] = useState('onboarding'); // 'onboarding' | 'whoStarts' | 'playing' | 'sectionComplete' | 'gameComplete'
          const [currentTurn, setCurrentTurn] = useState('male'); // 'male' | 'female'
          const [isCardFlipped, setIsCardFlipped] = useState(false);
          const [currentSection, setCurrentSection] = useState(1);
          const [completedTasksInSection, setCompletedTasksInSection] = useState(0);
          const [availableCards, setAvailableCards] = useState([]);
          const [currentCard, setCurrentCard] = useState(null);
          const [timerActive, setTimerActive] = useState(false);
          const [timeRemaining, setTimeRemaining] = useState(0);
          const [totalCompleted, setTotalCompleted] = useState(0);
          const [allCards, setAllCards] = useState([]);
          const [cardAnimation, setCardAnimation] = useState(null);
          const [currentTheme, setCurrentTheme] = useState('crimson');
          const [soundEnabled, setSoundEnabled] = useState(true);
          const timerRef = useRef(null);

          // Apply dynamic CSS variables on theme change
          useEffect(() => {
            const theme = THEMES[currentTheme] || THEMES.crimson;
            document.documentElement.style.setProperty('--theme-bg', theme.bgGradient);
            document.documentElement.style.setProperty('--theme-primary', theme.primary);
            document.documentElement.style.setProperty('--theme-primary-dark', theme.primaryDark);
            document.documentElement.style.setProperty('--theme-glow', theme.glow);
            document.documentElement.style.setProperty('--theme-border', theme.border);
            document.documentElement.style.setProperty('--theme-badge-bg', theme.badgeBg);
            document.documentElement.style.setProperty('--theme-badge-text', theme.badgeText);
            document.body.style.background = theme.bgGradient;
          }, [currentTheme]);

          useEffect(() => {
            const loadCards = async () => {
              try {
                const response = await fetch('cards.json');
                const data = await response.json();
                const allCardsArray = [
                  ...data.section_1_love_romantic,
                  ...data.section_2_hug_kisses,
                  ...data.section_3_strip_playful,
                  ...data.section_4_fantasy_extended_play,
                  ...data.section_5_intense_aftercare
                ];
                setAllCards(allCardsArray);
              } catch (error) {
                console.error('Failed to load cards:', error);
                alert('Could not load cards. Please refresh the page.');
              }
            };
            loadCards();
          }, []);

          useEffect(() => {
            if (timerActive && timeRemaining > 0) {
              timerRef.current = setTimeout(() => {
                setTimeRemaining(prev => prev - 1);
              }, 1000);
            } else if (timeRemaining === 0 && timerActive) {
              setTimerActive(false);
              playSensualSound('complete', soundEnabled);
            }
            return () => clearTimeout(timerRef.current);
          }, [timerActive, timeRemaining]);

          const initializeSection = (sectionNum) => {
            const sectionCards = allCards.filter(c => c.section === sectionNum);
            const shuffled = [...sectionCards].sort(() => Math.random() - 0.5);
            setAvailableCards(shuffled);
            setCurrentCard(shuffled[0]);
            setCompletedTasksInSection(0);
            setCurrentSection(sectionNum);
            setIsCardFlipped(false);
          };

          const goToWhoStarts = () => {
            if (allCards.length === 0) {
              alert('Cards not loaded yet. Please refresh.');
              return;
            }
            setGameState('whoStarts');
          };

          const startGame = (startingPartner) => {
            initializeSection(1);
            setCurrentTurn(startingPartner || 'male');
            setIsCardFlipped(false);
            setGameState('playing');
            setTotalCompleted(0);
          };

          const handleCardFlip = () => {
            if (!isCardFlipped) {
              setIsCardFlipped(true);
              playSensualSound('flip', soundEnabled);
            }
          };

          const handleSwitchTurn = () => {
            setCurrentTurn(prev => prev === 'male' ? 'female' : 'male');
            playSensualSound('flip', soundEnabled);
          };

          const handleSkip = () => {
            setCardAnimation('skip');
            setTimeout(() => {
              const remaining = availableCards.slice(1);
              const reshuffled = [...remaining, currentCard].sort(() => Math.random() - 0.5);
              setAvailableCards(reshuffled);
              setCurrentCard(reshuffled[0]);
              setCardAnimation(null);
              setTimerActive(false);
              setIsCardFlipped(false);
              // Alternate turn to partner
              setCurrentTurn(prev => prev === 'male' ? 'female' : 'male');
            }, 450);
          };

          const handleComplete = () => {
            playSensualSound('complete', soundEnabled);
            setCardAnimation('complete');
            setTimeout(() => {
              setTimerActive(false);
              setCompletedTasksInSection(prev => prev + 1);
              setTotalCompleted(prev => prev + 1);
              setIsCardFlipped(false);
              // Alternate turn to partner
              setCurrentTurn(prev => prev === 'male' ? 'female' : 'male');

              const remaining = availableCards.slice(1);
              if (remaining.length === 0 || completedTasksInSection + 1 >= 10) {
                setGameState('sectionComplete');
              } else {
                setCurrentCard(remaining[0]);
                setAvailableCards(remaining);
                setCardAnimation(null);
              }
            }, 450);
          };

          const nextSection = () => {
            if (currentSection < 5) {
              initializeSection(currentSection + 1);
              setGameState('playing');
            } else {
              setGameState('gameComplete');
            }
          };

          const resetGame = () => {
            setGameState('onboarding');
            setCurrentSection(1);
            setCompletedTasksInSection(0);
            setTotalCompleted(0);
            setIsCardFlipped(false);
          };

          const formatTime = (seconds) => {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
          };

          const sectionMeta = {
            1: { name: 'Love & Romantic', emoji: '🥂 Romance & Whispers 💜' },
            2: { name: 'Hug & Kisses', emoji: '💋 Kisses & Caresses 🫦' },
            3: { name: 'Strip & Playful', emoji: '✨ Strip & Tease 👙' },
            4: { name: 'Fantasy & Extended', emoji: '🔥 Wild Desires & Fantasy ⛓️' },
            5: { name: 'Intense & Aftercare', emoji: '💥 Peak Passion & Aftercare 🛏️' }
          };

          const theme = THEMES[currentTheme] || THEMES.crimson;

          return (
            <div className="min-h-screen w-full flex flex-col items-center justify-between p-4 relative overflow-hidden">
              {/* Subtle Floating Ambient Particles */}
              <div className="ambient-particle text-xl" style={{ left: '10%', animationDuration: '14s', animationDelay: '0s' }}>❤️</div>
              <div className="ambient-particle text-lg" style={{ left: '85%', animationDuration: '18s', animationDelay: '3s' }}>🔥</div>
              <div className="ambient-particle text-2xl" style={{ left: '25%', animationDuration: '16s', animationDelay: '6s' }}>💋</div>
              <div className="ambient-particle text-sm" style={{ left: '75%', animationDuration: '20s', animationDelay: '9s' }}>✨</div>
              <div className="ambient-particle text-xl" style={{ left: '50%', animationDuration: '22s', animationDelay: '4s' }}>🌹</div>

              {/* Top Floating Mood Swatch Bar */}
              <div className="w-full max-w-md mx-auto flex items-center justify-between py-2 px-4 rounded-full swatch-pill z-20 mb-4">
                <div className="flex items-center gap-2">
                  <span className="text-sm">{theme.icon}</span>
                  <span className="text-xs font-bold text-gray-200 tracking-wider uppercase">{theme.name}</span>
                </div>

                <div className="flex items-center gap-2.5">
                  {/* Swatches */}
                  {Object.values(THEMES).map((t) => (
                    <button
                      key={t.id}
                      onClick={() => setCurrentTheme(t.id)}
                      title={`Switch to ${t.name}`}
                      className={`swatch-btn ${currentTheme === t.id ? 'active' : ''}`}
                      style={{ backgroundColor: t.swatch }}
                    />
                  ))}

                  {/* Sound Toggle */}
                  <button
                    onClick={() => setSoundEnabled(!soundEnabled)}
                    title={soundEnabled ? "Mute sound effects" : "Enable sound effects"}
                    className="text-xs px-2 py-1 rounded-full bg-white/10 hover:bg-white/20 text-gray-300 ml-1 transition-all"
                  >
                    {soundEnabled ? '🔊' : '🔇'}
                  </button>
                </div>
              </div>

              {/* Main Content Area */}
              <div className="w-full max-w-md my-auto z-10">
                {gameState === 'onboarding' && (
                  <OnboardingScreen onNext={goToWhoStarts} theme={theme} />
                )}

                {gameState === 'whoStarts' && (
                  <WhoStartsFirstScreen onSelectStarter={startGame} theme={theme} soundEnabled={soundEnabled} />
                )}

                {gameState === 'playing' && currentCard && (
                  <PlayingScreen
                    currentCard={currentCard}
                    currentSection={currentSection}
                    completedInSection={completedTasksInSection}
                    totalCompleted={totalCompleted}
                    cardAnimation={cardAnimation}
                    timerActive={timerActive}
                    timeRemaining={timeRemaining}
                    currentTurn={currentTurn}
                    isCardFlipped={isCardFlipped}
                    onFlipCard={handleCardFlip}
                    onSwitchTurn={handleSwitchTurn}
